name: Evals

on:
  workflow_dispatch:
  pull_request:
    # Labeling is a one-shot trigger (no synchronize): remove and re-add `run-evals` to rerun.
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -m evals -v
      - run: uv run -m livekit.agents download-files
      # The install script always fetches the latest release and cannot be pinned (developed against lk 2.19.1).
      - run: curl -sSL https://get.livekit.io/cli | bash
      - run: lk agent simulate text --scenarios scenarios.yaml --yes
